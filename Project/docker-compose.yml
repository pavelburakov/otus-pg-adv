version: '3.8'

services:
  postgres-tsid:
    build: .
    container_name: postgres-tsid
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      NODE_ID: 40
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
